[project]
name = "stockhub"
version = "0.1.0"
description = "StockHub batch ETL, features and backtest engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-storage>=2.18",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stockhub"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stockhub", "tests"]
# Passing an ABC as type[T] is intended here (isinstance checks against interfaces).
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
# google-cloud-storage ships without type information.
module = ["google.cloud.*", "google.api_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
