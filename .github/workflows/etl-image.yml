name: ETL image

# Builds the ETL container on every change to py/ or infra/ and smoke-tests it.
# Pushing to Artifact Registry is manual (workflow_dispatch with push=true) and stays
# disabled until the GCP repository variables below are configured (see infra/README.md).

on:
  pull_request:
    paths: ["py/**", "infra/**", ".dockerignore", ".github/workflows/etl-image.yml"]
  push:
    branches: [main]
    paths: ["py/**", "infra/**", ".dockerignore", ".github/workflows/etl-image.yml"]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to Artifact Registry (requires GCP variables)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only used by the optional GCP push below
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          tags: stockhub-etl:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (lists jobs, runs as non-root)
        run: |
          docker run --rm stockhub-etl:ci list | tee jobs.txt
          grep -q heartbeat jobs.txt
          test "$(docker run --rm --entrypoint id stockhub-etl:ci -u)" = "10001"

      # ------------------------------------------------------------------ optional push
      # Repository variables: GCP_PROJECT_ID, GCP_REGION, GCP_AR_REPO,
      # GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT (Workload Identity Federation).
      - name: Authenticate to Google Cloud
        if: inputs.push && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Push to Artifact Registry
        if: inputs.push && vars.GCP_PROJECT_ID != ''
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/etl
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker tag stockhub-etl:ci "$IMAGE:${GITHUB_SHA::7}"
          docker tag stockhub-etl:ci "$IMAGE:latest"
          docker push --all-tags "$IMAGE"
