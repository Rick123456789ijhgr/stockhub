# Local development database. Host port 5433 avoids clashing with a native Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    # Same tuning as scripts/local-pg.sh (docs/DECISIONS.md D-117).
    command: postgres -c shared_buffers=2GB -c effective_cache_size=12GB -c work_mem=32MB -c random_page_cost=1.1
    shm_size: 1g
    environment:
      POSTGRES_USER: stockhub
      POSTGRES_PASSWORD: stockhub
      POSTGRES_DB: stockhub
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockhub -d stockhub"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
