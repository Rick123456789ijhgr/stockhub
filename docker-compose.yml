# Local development database. Host port 5433 avoids clashing with a native Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockhub
      POSTGRES_PASSWORD: stockhub
      POSTGRES_DB: stockhub
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockhub -d stockhub"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
